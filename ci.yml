name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Check Client TypeScript & Build
        run: |
          cd client
          npm run build

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Compile Server TypeScript
        run: |
          cd server
          npm run build

      - name: Test Python Service Syntax
        run: |
          cd python-service
          python -m py_compile app.py || true
